<!DOCTYPE html>
<html lang="en">
<head>

      <style>

       .card-body{
            text-align: center;
            font-size: 22px;

            padding-bottom: 10px;

        }
         .card-img{
          width: 100%;
          height: 350px;

          border-bottom-right-radius: 10px;

          border-top-right-radius: 10px;
        }
          main{

            flex-direction: row;

        }
