<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT</title>
      <style>
        header{
            background-color: rgb(211, 255, 18);
            color: black;
            font-size: large;
            font-weight: bold;
            text-align: center;
            font-family: Arial;
            padding:8px;
            border-radius: 6px;
        }
      
        .card{
            border:1px solid black;
            border-radius: 10px;
        }
        .card-header{
            align-items: center;
            border-bottom-left-radius: 8px;
            border-radius: 8px;
        }
        .card-body{
            text-align: center;
            font-size: 22px;
            padding-left: 15px;
            padding-bottom: 10px;
        }
        form{
            display: grid;
            column: gap 2px;;
        }
        .submit{
              background-color: rgb(70, 218, 122);
            color:black;
            border-bottom-left-radius: 7px;
            padding:10px;
            text-align: center;
            font-size: 20px;
        }
        .xyz{
            border: 1px solid black;
            padding-bottom: 10px;
            padding: 20px;
            border-radius: 10px;
            padding-right: 10px;
            padding-left: 10px;
            padding-top: 10px;
        }
          .card-img{
          width: 100%;
          height: 350px;
          border-bottom-left-radius: 10px;
          border-bottom-right-radius: 10px;
          border-top-left-radius: 10px;
          border-top-right-radius: 10px;
        }
          main{
            display: flex;
            flex-direction: row;
            justify-content: center;
        }
       
    </style>
</head>
<body>
    <header>
    <div>CONTACT </div>
</header>   
<br><br>
<section>
    <main>
        <div class="card">
            <div class="card-header">
                <img src="../public/images/contact image. jpg " width="100%"></div>
                <div class="card-body">
                 <h2>Contact Us</h2>
               <form >
              <div>
                <label>Name:</label>
                 <input type="text" placeholder="Your Name" class="xyz"/><br><br>
                 <label>Email:</label>
              <input type="email" placeholder="Your Email" class="xyz"/><br><br>
               <label>MObile:</label>
               <input type="number" placeholder="Mobile Number" class="xyz">
              </div>
              <br>
               <textarea rows="1" placeholder="Your Message" class="xyz"></textarea>
               <br><br>
             <div>
                 <span class="submit"> Submit </span>
             </div>
               </form>
               <footer>
                 <p>@2026 3D Websoft Foundation. All Rights Reserved.</p>
       </footer>
      </div>  
    </main> 
</section>
</body>
</html>
