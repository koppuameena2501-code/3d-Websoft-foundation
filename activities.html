<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Activities</title>
      <style>
         header{
            background-color: rgb(211, 255, 18);
            color: black;
            font-size: large;
            font-weight: bold;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            padding:8px;
            border-radius: 6px;
        }
      
       .card{
            border:1px solid black;
            border-radius: 10px;
            width: 800px;
            align-items: center;
            padding: 8px;
        }
            .card-header{
            align-items: center;
            border-bottom-left-radius: 8px;
            border-radius: 8px;
        }
       .card-body{
            text-align: center;
            font-size: 22px;
            padding-left: 15px;
            padding-bottom: 10px;
            height:380px;
        
        }
         .card-img{
          width: 100%;
          height: 350px;
          border-bottom-left-radius: 10px;
          border-bottom-right-radius: 10px;
          border-top-left-radius: 10px;
          border-top-right-radius: 10px;
        }
          main{
            display: flex;
            flex-direction: row;
            justify-content: center;
        }
    </style>
</head>
<body>
    <header>
    <div>NGO ACTIVITIES PAGE </div>
</header>  
<br><br> 
<section>
    <main>
        <div class="card">
            <div class="card-header">
                <img src="../public/images/educational support.jpg " width="100%"></div>
                <div class="card-body">
                 <h2>NGO Activities:</h2>
                 <h3>Education Support</h3>
                <p>Helping Students with digital education and learning resources.</p>
                    <h3>Healthcare Camps</h3>
                    <p>Conducting health awareness programs and medical support camps.</p>
                    <h3>Community Welfare</h3>
                   <p>Supporting rural development and social Welfare initiatives.</p>
                </div>  
    </main> 
</section>
</body>
</html>
